name: Bench2Drive Code Check

# NOTE: Bench2Drive closed-loop evaluation requires CARLA 0.9.15 locally.
# This workflow checks code correctness only (syntax, config params, docs).
# For actual closed-loop evaluation see docs/bench2drive_setup.md.

on:
  push:
    branches: [main, 'claude/*']
  pull_request:
  workflow_dispatch:

jobs:
  code-check:
    name: Bench2Drive Code Correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: CARLA requirement notice
        run: |
          echo "============================================================"
          echo " NOTICE: Full Bench2Drive evaluation requires:"
          echo "   - CARLA 0.9.15 installed locally"
          echo "   - GPU with >= 24 GB VRAM"
          echo "   - carla Python package"
          echo ""
          echo "   See docs/bench2drive_setup.md for instructions."
          echo "============================================================"

      - name: Syntax check all Python files
        run: |
          python - << 'PYEOF'
          import ast, glob, sys
          files = (
              glob.glob('nuScenes/**/*.py', recursive=True) +
              glob.glob('vqa_evaluation/**/*.py', recursive=True)
          )
          errors = []
          for path in sorted(files):
              try:
                  ast.parse(open(path).read())
              except SyntaxError as e:
                  errors.append(f'{path}: {e}')
          if errors:
              print('Syntax errors:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'All {len(files)} Python files pass syntax check.')
          PYEOF

      - name: Validate YAML workflows
        run: |
          pip install pyyaml --quiet
          python - << 'PYEOF'
          import glob, yaml, sys
          errors = []
          for path in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(path).read())
                  print(f'OK: {path}')
              except yaml.YAMLError as e:
                  errors.append(f'{path}: {e}')
          if errors:
              for e in errors:
                  print(f'FAIL: {e}')
              sys.exit(1)
          PYEOF

      - name: Check required documentation
        run: |
          python - << 'PYEOF'
          import os, sys
          required = [
              'docs/installation.md',
              'docs/data_preparation.md',
              'docs/train_eval_nuscenes_mini.md',
              'docs/bench2drive_setup.md',
              'docs/evaluation_results.md',
          ]
          missing = [d for d in required if not os.path.isfile(d)]
          for d in required:
              status = 'OK' if os.path.isfile(d) else 'MISSING'
              print(f'{status}: {d}')
          if missing:
              sys.exit(1)
          PYEOF

      - name: Verify nuScenes mini config params (ast parse)
        run: |
          python - << 'PYEOF'
          import ast, sys

          with open('nuScenes/projects/configs/UniDriveVLA/unidrivevla_mini_stage1.py') as f:
              src = f.read()
          tree = ast.parse(src)

          # Extract simple name=value assignments
          vals = {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for t in node.targets:
                      if isinstance(t, ast.Name):
                          try:
                              vals[t.id] = ast.literal_eval(node.value)
                          except Exception:
                              pass

          checks = {
              'bev_h_':      (50,         'BEV height = 50'),
              'bev_w_':      (50,         'BEV width  = 50'),
              'queue_length':(3,          'queue_length = 3'),
              'version':     ('v1.0-mini','version = v1.0-mini'),
              'total_epochs':(24,         'total_epochs = 24'),
          }
          failed = []
          for var, (expected, desc) in checks.items():
              got = vals.get(var)
              if got == expected:
                  print(f'  OK  : {desc}')
              else:
                  failed.append(f'  FAIL: {desc}  (got {got!r}, expected {expected!r})')
          if failed:
              for f in failed:
                  print(f)
              sys.exit(1)
          print('All config checks passed.')
          PYEOF

      - name: Publish step summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'MD'
          ## Bench2Drive Code Check

          | Check | Description |
          |-------|-------------|
          | Python syntax | All .py files in nuScenes/ and vqa_evaluation/ |
          | YAML validity | All .github/workflows/*.yml |
          | Documentation | Required docs/*.md files |
          | Config params | bev_h=50, bev_w=50, queue_length=3, v1.0-mini |

          > **Full closed-loop evaluation requires CARLA 0.9.15.**
          > See [bench2drive_setup.md](docs/bench2drive_setup.md).
          MD
